<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaani</title>
<meta name="theme-color" content="#5b4fe0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pri:#5b4fe0;--pri2:#7c6cf0;--deep:#2f2580;--ink:#241f4a;--mute:#6f6a96;--ok:#1fa36b;--bad:#d9480f;--gold:#ffb020;color-scheme:light}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.45;background:linear-gradient(165deg,#f3eefe 0%,#fde8f3 45%,#e4eefe 100%) fixed;padding-top:env(safe-area-inset-top,0)}
.hide{display:none!important}
.screen{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 14px 120px}
h2,h3,p{margin:0}
button{font:inherit;border:0;cursor:pointer;font-weight:700;border-radius:16px;padding:12px 16px;min-height:48px;background:var(--pri);color:#fff}
button:disabled{opacity:.35;cursor:default}
button.gold{background:var(--gold);color:var(--ink)}
button.ghost{background:transparent;color:var(--pri);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 18px rgba(91,79,224,.12);margin-bottom:14px}
.mute{color:var(--mute)}
/* splash */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(165deg,#f3eefe,#fde8f3 50%,#e4eefe);transition:opacity .45s}
#splash.out{opacity:0}
#splash img{width:min(66vw,290px);border-radius:12%;box-shadow:0 18px 40px rgba(91,79,224,.3);animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
#splash h1{margin:22px 0 4px;font-size:3.2rem;color:var(--deep);letter-spacing:2px;animation:up .8s .5s both}
#splash p{color:var(--pri);font-weight:700;font-size:1.15rem;letter-spacing:2px;animation:up .8s .9s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
/* home */
.hh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hh div{flex:1}.hh small{color:var(--mute)}.hh h2{font-size:1.4rem}
select{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--pri2);background:#fff;color:var(--ink)}
.coach{display:flex;align-items:center;gap:12px;color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,var(--pri),#8b7bf5);box-shadow:0 10px 24px rgba(91,79,224,.35)}
.coach>div{flex:1}.coach small{opacity:.85}.coach h3{font-size:1.5rem;margin:2px 0}.coach p{opacity:.95;margin-bottom:12px}
.coach img{width:96px;height:96px;border-radius:50%;border:4px solid rgba(255,255,255,.7);object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats .card{margin:0;text-align:center;padding:12px 6px}.stats b{display:block;font-size:1.35rem;color:var(--pri)}.stats small{color:var(--mute)}
.testcard{display:flex;align-items:center;gap:12px;border-radius:24px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,#ffd6ea,#ffe9f4);box-shadow:0 6px 18px rgba(236,91,154,.18)}
.testcard>div{flex:1}.testcard p{color:var(--mute)}.testcard button{background:#ec5b9a}
.chart{width:100%;height:auto;margin-top:8px}
.unit{margin:18px 4px 8px;color:var(--deep);font-size:1.05rem}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:var(--ink);border-radius:20px;padding:10px 14px;margin-bottom:10px;box-shadow:0 4px 12px rgba(91,79,224,.1);font-weight:600}
.item .n{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.item .t{flex:1}.item small{display:block;color:var(--mute);font-weight:400}.item .s{font-size:1.5rem}
.bigp{font-size:2.2rem;font-weight:800;color:var(--ok)}.warn{color:var(--bad);margin:8px 0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(91,79,224,.15);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));z-index:5}
.nav button{flex:1;background:transparent;color:var(--mute);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:none}
.nav button span{font-size:1.4rem}.nav button.on{color:var(--pri)}
/* lesson (coach screen) */
.lh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lh .bk{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--pri);font-size:1.5rem;padding:0;box-shadow:0 3px 10px rgba(91,79,224,.15)}
.lh div{flex:1;text-align:center}.lh b{display:block;font-size:1.1rem}.lh small{color:var(--mute)}
.lh .cnt{min-width:54px;text-align:center;background:#fff;border-radius:14px;padding:8px;color:var(--pri);font-weight:700;font-size:.9rem;flex:none}
.bar{height:8px;background:#fff;border-radius:6px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),#ec5b9a);transition:width .3s}
.avrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}


.av {
    width: 155px;
    height: 155px;
    position: relative;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #c9bfff, #ffc9e3);
    flex: none;
}


.av::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background-image: url("vaani-expressions.png");
    background-size: 300% 300%;
    background-repeat: no-repeat;
    background-position: 0% 0%;
}

.av.face-0::before { background-position: 0% 0%; }
.av.face-1::before { background-position: 50% 0%; }
.av.face-2::before { background-position: 100% 0%; }

.av.face-3::before { background-position: 0% 50%; }
.av.face-4::before { background-position: 50% 50%; }
.av.face-5::before { background-position: 100% 50%; }

.av.face-6::before { background-position: 0% 100%; }
.av.face-7::before { background-position: 50% 100%; }
.av.face-8::before { background-position: 100% 100%; }

.av.on {
    animation: ringp 1.2s infinite;
}

.av.on{animation:ringp 1.2s infinite}
@keyframes ringp{0%{box-shadow:0 0 0 0 rgba(124,108,240,.55)}100%{box-shadow:0 0 0 18px rgba(124,108,240,0)}}
.wave{display:flex;align-items:center;gap:3px;height:40px}
.wave i{display:block;width:4px;height:8px;border-radius:2px;background:var(--pri2);opacity:.55}
.wave.on i{animation:bar .8s ease-in-out infinite;opacity:1}
@keyframes bar{0%,100%{height:8px}50%{height:32px}}
.bubble{background:#ece8fb;border-radius:20px;padding:12px 16px;text-align:center;margin-bottom:12px}
.bubble .say{font-weight:700;font-size:1.1rem}.bubble .hi{color:var(--pri);font-size:.95rem;margin-top:2px}
.stage{text-align:center;margin-bottom:6px}.pic{font-size:3.6rem;line-height:1.15}.word{font-size:2.2rem;font-weight:800;color:var(--pri)}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.opts .opt{flex:1;min-width:30%;background:#fff;color:var(--ink);border:2px solid #d9d2fb;font-size:2.2rem;padding:8px}.opts .opt.long{font-size:1rem}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
input{width:100%;font:inherit;font-size:1.2rem;padding:12px;border-radius:14px;border:2px solid #d9d2fb;margin-top:10px;background:#fff;color:var(--ink)}
.ysc{background:#fff;border-radius:18px;padding:10px 14px;margin-top:10px;box-shadow:0 4px 12px rgba(91,79,224,.1)}
.ysc small{color:var(--mute)}.ysc div{font-size:1.15rem;font-weight:600}
.recbar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pri),#8b7bf5);border-radius:20px;padding:8px 12px;margin-top:10px;color:#fff}
.recbar button{width:42px;height:42px;min-height:42px;border-radius:50%;background:#fff;color:var(--pri);padding:0}
.recbar .wave{flex:1;justify-content:space-between}.recbar .wave i{background:#fff;opacity:.9}
.fb{margin-top:10px;min-height:1.5em;font-weight:700;text-align:center}.fb.g{color:var(--ok)}.fb.b{color:var(--bad)}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:26px;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0));width:min(480px,100%);background:linear-gradient(0deg,rgba(243,238,254,.98) 65%,rgba(243,238,254,0))}
.dock .sm{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--pri);font-size:1.4rem;padding:0;box-shadow:0 4px 12px rgba(91,79,224,.18)}
.dock .mic{width:78px;height:78px;border-radius:50%;font-size:2rem;padding:0;background:linear-gradient(135deg,var(--pri),#8b7bf5);box-shadow:0 8px 20px rgba(91,79,224,.45)}
.dock .mic.rec{background:linear-gradient(135deg,#ec5b9a,#ff7a59);animation:ringp 1s infinite}
/* result */
.rcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:20px;box-shadow:0 8px 22px rgba(91,79,224,.15);margin:14px 0}
.rcard>div{flex:1}.rbig{font-size:3.6rem;font-weight:800;color:var(--ok);line-height:1}.rbig span{font-size:1.2rem;color:var(--mute)}
.rcard svg{width:110px;height:110px;flex:none}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sub{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 12px rgba(91,79,224,.1)}
.sub i{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-style:normal}
.sub b{display:block;font-size:1.4rem}.sub small{color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px;max-height:42vh;overflow:auto}
.msg{max-width:92%;padding:10px 14px;border-radius:18px;font-weight:600}
.msg.me{align-self:flex-end;background:#d9d2fb}
.msg.v{align-self:flex-start;background:#fff;box-shadow:0 4px 12px rgba(91,79,224,.1)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tiles b{width:38px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#8b7bf5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.tiles span{width:100%;font-size:.85rem;color:var(--mute);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:#fff;color:var(--pri);border:2px solid #d9d2fb;border-radius:18px;padding:8px 12px;min-height:0;font-size:.9rem}
.askcard{display:flex;align-items:center;gap:12px;border-radius:24px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,#d7e6ff,#e8f0ff);box-shadow:0 6px 18px rgba(91,79,224,.14)}
.askcard>div{flex:1}.askcard p{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
 <img src="logo.webp" alt="Vaani">
 <h1>Vaani</h1>
 <p>Learn · Speak · Grow</p>
</div>

<div id="home" class="screen hide">
 <div class="hh"><div><small>Hello 👋</small><h2>Ready to learn?</h2></div><select id="lg" aria-label="Language"></select></div>
 <section id="t0"></section>
 <section id="t1" class="hide"></section>
 <section id="t2" class="hide"></section>
 <nav class="nav">
  <button data-t="0" class="on"><span>🏠</span>Home</button>
  <button data-t="1"><span>📚</span>Lessons</button>
  <button data-t="2"><span>📝</span>Test</button>
  <button data-go="ask"><span>🎙️</span>Ask</button>
 </nav>
</div>

<div id="lesson" class="screen hide">
 <div class="lh"><button class="bk" id="back" aria-label="Back">‹</button><div><b id="ltitle">Vaani</b><small id="lsub">Your English tutor</small></div><span class="cnt" id="lcount"></span></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="avrow">
  <div class="wave" id="wl"></div>

  <div class="av face-0" id="av" role="img" aria-label="Vaani"></div>

  <div class="wave" id="wr"></div>
</div>
<div class="stage">
    <div class="pic" id="pic"></div>
    <div class="word" id="word"></div>
</div>
<div class="bubble">
    <div class="say" id="say"></div>
    <div class="hi" id="hi"></div>
</div>
 <div id="ctl"></div>
 <div class="ysc hide" id="ysCard"><small>You said</small><div id="ys"></div></div>
 <div class="recbar hide" id="recbar"><button id="rstop" aria-label="Stop">■</button><div class="wave" id="rbars"></div><span id="rt">0:00</span></div>
 <div class="fb" id="fb" aria-live="polite"></div>
 <div class="dock">
  <button class="sm" id="kb" aria-label="Type instead">⌨️</button>
  <button class="mic" id="mic" aria-label="Speak">🎤</button>
  <button class="sm" id="bulb" aria-label="Hear again">💡</button>
 </div>
</div>

<div id="ask" class="screen hide">
    <div class="lh">
        <button class="bk" id="aback" aria-label="Back">‹</button>
        <div><b>Ask Vaani</b></div>
    </div>

    <div class="avrow">
        <div class="av face-0" id="aav" role="img" aria-label="Vaani"></div>
        <div class="wave" id="awr"></div>
    </div>
   
 <div class="chat" id="chat"></div>
 <div class="chips" id="chips"></div>
 <div class="ysc hide" id="aysCard"><small>You said</small><div id="ays"></div></div>
 <div class="recbar hide" id="arecbar"><button id="arstop" aria-label="Stop">■</button><div class="wave" id="arbars"></div><span id="art">0:00</span></div>
 <div class="row hide" id="atype"><input id="ain" placeholder="Type your question" autocomplete="off"><button id="asend">Send</button></div>
 <div class="fb" id="afb" aria-live="polite"></div>
 <div class="dock">
  <button class="sm" id="akb" aria-label="Type">⌨️</button>
  <button class="mic" id="amic" aria-label="Speak">🎤</button>
  <button class="sm" id="abulb" aria-label="Help">💡</button>
 </div>
</div>

<div id="result" class="screen hide">
 <div class="lh"><button class="bk" id="rback" aria-label="Home">‹</button><div><b id="rtitle">Lesson complete</b><small>Your score</small></div><span class="cnt"></span></div>
 <div class="rcard">
  <div><small class="mute">Score</small><div class="rbig" id="rbig"></div><p id="rmsg" style="font-weight:700;margin-top:6px"></p></div>
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#e6e1fb" stroke-width="9"/><circle id="ring" cx="50" cy="50" r="45" fill="none" stroke="#1fa36b" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 282.7" transform="rotate(-90 50 50)"/><text x="50" y="62" text-anchor="middle" font-size="34">⭐</text></svg>
 </div>
 <div class="subs" id="subs"></div>
 <div class="card" id="missed" style="margin-top:14px"></div>
 <div class="row"><button id="rnext">Next ▶</button><button class="gold" id="rhome">Home</button></div>
</div>

<script src="lessons.js"></script>
<script>
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const UNITS=["Sounds & Greetings","Numbers & Time","Family & Home","Village & Market","Daily Actions","Real-Life English"];
const UCOL=["#5b4fe0","#ec5b9a","#f59e0b","#2bb5b0","#7c6cf0","#1fa36b"];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

//#PURE
function lev(a,b){const d=Array.from({length:a.length+1},(_,x)=>[x]);for(let y=1;y<=b.length;y++)d[0][y]=y;
 for(let x=1;x<=a.length;x++)for(let y=1;y<=b.length;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return d[a.length][b.length]}
const NW="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty".split(" "),TW={30:"thirty",40:"forty",50:"fifty",60:"sixty",70:"seventy",80:"eighty",90:"ninety",100:"one hundred"};
const HOMO={two:["to","too"],four:["for"],one:["won"],eight:["ate"],no:["know"],there:["their"],here:["hear"],tea:["tee"],wait:["weight"]};
const clean=h=>h.toLowerCase().replace(/\bi'm\b/g,"i am").replace(/\byou're\b/g,"you are").replace(/\bhe's\b/g,"he is").replace(/\bshe's\b/g,"she is").replace(/\bit's\b/g,"it is").replace(/\d+/g,m=>NW[+m]||TW[+m]||m).replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const tol=t=>t.length>=6?2:t.length>=4?1:0;
function matches(alts,t){
 for(const a of alts){const c=clean(a);if(!c)continue;
  if(lev(c,t)<=tol(t))return true;
  if((" "+c+" ").includes(" "+t+" "))return true;
  if((HOMO[t]||[]).some(h=>c===h||(" "+c+" ").includes(" "+h+" ")))return true}
 return false}
const isPic=p=>!p.includes("🍋")&&!/^\d+$/.test(p)&&[...p].length<=3&&!/\u20e3/.test(p);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function poolOf(done,L){const seen={},out=[];Object.keys(done).forEach(i=>L[i].s.forEach(s=>{if(s.t==="rep"&&s.w&&s.p&&isPic(s.p)&&!seen[s.w]){seen[s.w]=1;out.push({w:s.w,p:s.p,sent:/\s/.test(s.w)})}}));return out}
function buildTest(pool){
 const words=pool.filter(x=>!x.sent),pics=[...new Set(words.map(x=>x.p))];
 if(words.length<4||pics.length<4)return null;
 const out=[];
 shuffle(words).slice(0,5).forEach(x=>out.push({t:"tap",q:"Listen and tap the picture.",say:x.w,w:x.w,ans:x.p,opts:shuffle([x.p,...shuffle(pics.filter(p=>p!==x.p)).slice(0,3)])}));
 shuffle(words).slice(0,3).forEach(x=>out.push({t:"typ",w:x.w,p:x.p,bubble:"Listen and type the word.",say:x.w,hideWord:true,alts:words.filter(y=>y.p===x.p).map(y=>y.w)}));
 shuffle(pool).slice(0,2).forEach(x=>out.push({t:"rep",w:x.w,p:x.p,bubble:"Read this out loud.",silent:true}));
 return out}
const LET={a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"eff",g:"jee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"el",m:"em",n:"en",o:"oh",p:"pee",q:"queue",r:"ar",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zed"};
const DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MONN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const norm=q=>q.toLowerCase().replace(/[?!.,"“”]/g," ").replace(/\s+/g," ").trim();
// Vaani's offline brain: she understands a fixed set of questions (no internet needed).


function answer(q, ctx) {
  const n = norm(q);
  const now = ctx.now || new Date();
  let m;

  const say = (t, r = 0.85) => [{ t, r }];
  const reply = (t) => ({ text: t, say: say(t) });
    
  const selectedLang = ctx.lang || "en";

  const bilingual = (english, local) => ({
    text: english + "\n\n" + local,
    say: [
      { t: english, r: 0.85, l: "en" },
      { t: local, r: 0.85, l: "hi" }
    ]
  });

  const localResponses = {
    hi: {
      greeting: "नमस्ते! मैं वाणी हूँ, आपकी अंग्रेज़ी सीखने में मदद करने वाली सहायक। आज आप क्या सीखना चाहेंगे?",
      thanks: "आपका स्वागत है! अपनी अंग्रेज़ी का अभ्यास करते रहें।",
      identity: "मैं वाणी हूँ, आपकी अंग्रेज़ी सीखने में मदद करने वाली सहायक। मैं आपको अंग्रेज़ी का अभ्यास करने में मदद कर सकती हूँ।",
      help: "मैं व्याकरण, काल, शब्दावली, वर्तनी, उच्चारण, अनुवाद, वाक्य बनाना, वाक्य सुधारना और रोज़मर्रा की बातचीत सीखने में आपकी मदद कर सकती हूँ।"

function speak(list, cb) {
    stopRec();

    if (!("speechSynthesis" in window)) {
        cb && cb();
        return;
    }

    speechSynthesis.cancel();

    const q = list.filter(x => x.t);

    (function next() {
        const x = q.shift();

        if (!x) {
            setSpeaking(false);
            cb && cb();
            return;
        }

        const localLang = x.l === "hi"
            ? lang
            : (LANGS[x.l] ? x.l : null);

        const code = localLang
            ? LANGS[localLang].v
            : "en-IN";

        const voices = speechSynthesis.getVoices();

        const v = localLang
            ? voices.find(voice =>
                voice.lang.toLowerCase() === code.toLowerCase()
              )
            : voices.find(voice =>
                voice.name === "Microsoft Heera - English (India)"
            );

        const u = new SpeechSynthesisUtterance(x.t);

        if (v) {
            u.voice = v;
        }

        u.lang = code;
        u.rate = x.r || (localLang ? .9 : .8);
        u.pitch = 1.15;

        let fallbackTimer;
        let closeTimer;
        let boundaryDetected = false;
        let frameIndex = 0;

        const speakingFrames = [1, 2, 3, 6];

        function clearAnimationTimers() {
            clearInterval(fallbackTimer);
            clearTimeout(closeTimer);
        }

        u.onstart = () => {
            setSpeaking(true);
            setAvatarFrame(0);

            fallbackTimer = setInterval(() => {
                if (!boundaryDetected) {
                    frameIndex = (frameIndex + 1) % speakingFrames.length;
                    setAvatarFrame(speakingFrames[frameIndex]);
                }
            }, 170);
        };

        u.onboundary = event => {
            if (event.name !== "word") return;

            boundaryDetected = true;
            clearInterval(fallbackTimer);

            const start = event.charIndex || 0;
            const word = x.t.slice(start).split(/\s+/)[0] || "";

            const frame = /[ou]/i.test(word)
                ? 3
                : speakingFrames[frameIndex % speakingFrames.length];

            frameIndex++;
            setAvatarFrame(frame);

            clearTimeout(closeTimer);

            closeTimer = setTimeout(() => {
                setAvatarFrame(0);
            }, 140);
        };

        u.onend = () => {
            clearAnimationTimers();
            setAvatarFrame(0);
            next();
        };

        u.onerror = () => {
            clearAnimationTimers();
            setAvatarFrame(0);
            next();
        };

        speechSynthesis.speak(u);
    })();
}

 $("rmsg").style.color=pct>=60?"var(--ok)":"var(--bad)";
 $("ring").setAttribute("stroke-dasharray",(pct/100*282.7)+" 282.7");
 const sub=(k,l,ic,c)=>{const v=st[k];return '<div class="sub"><i style="background:'+c+'22">'+ic+'</i><b>'+(v[1]?Math.round(v[0]/v[1]*100):"–")+'</b><small>'+l+'</small></div>'};
 $("subs").innerHTML=sub("speaking","Speaking","🎤","#7c6cf0")+sub("listening","Listening","👂","#ec5b9a")+sub("spelling","Spelling","✏️","#f59e0b");
 const m=[...new Set(missed)];$("missed").classList.toggle("hide",!m.length);
 $("missed").innerHTML=m.length?"<h3>Words to practise</h3><p style='margin-top:6px'>"+m.join(" · ")+"</p>":"";
 const nx=$("rnext");nx.classList.toggle("hide",mode==="lesson"&&cur>=LESSONS.length-1);
 nx.textContent=mode==="test"?"Try another test":"Next lesson ▶";
}

/* ---- screens ---- */
function show_(n){["home","lesson","result","ask"].forEach(x=>$(x).classList.toggle("hide",x!==n));window.scrollTo(0,0)}
function openLesson(i){
 mode="lesson";cur=i;steps=LESSONS[i].s;st=newSt();missed=[];idx=0;micFails=0;
 $("ltitle").textContent="Vaani";$("lsub").textContent=title(i);show_("lesson");
 ensureMic().then(show);
}
function openTest(){
 const t=buildTest(poolOf(done,LESSONS));if(!t){tab(2);return}
 mode="test";steps=t;st=newSt();missed=[];idx=0;micFails=0;
 $("ltitle").textContent="Vaani's Test";$("lsub").textContent="Show what you have learned";show_("lesson");
 ensureMic().then(show);
}
function goHome(){stopRec();if("speechSynthesis" in window)speechSynthesis.cancel();setSpeaking(false);renderHome();show_("home")}
function tab(n){[0,1,2].forEach(i=>{$("t"+i).classList.toggle("hide",i!==n);document.querySelector('.nav [data-t="'+i+'"]').classList.toggle("on",i===n)});window.scrollTo(0,0)}
function chart(){
 const v=hist.slice(-8).map(x=>x.s);
 if(v.length<2)return '<p class="mute" style="margin-top:6px">Finish two lessons to see your progress line here.</p>';
 const W=300,Hh=110,p=14,sx=(W-2*p)/(v.length-1),pts=v.map((y,i)=>[p+i*sx,Hh-p-(y/100)*(Hh-2*p)]);
 const line=pts.map(a=>a.join(",")).join(" ");
 return '<svg viewBox="0 0 '+W+' '+Hh+'" class="chart"><polygon points="'+p+','+(Hh-p)+' '+line+' '+(p+(v.length-1)*sx)+','+(Hh-p)+'" fill="rgba(91,79,224,.15)"/><polyline points="'+line+'" fill="none" stroke="#5b4fe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map(a=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#5b4fe0"/>').join("")+'</svg>';
}
function renderHome(){
 const n=Object.keys(done).length,total=LESSONS.length,vals=Object.values(done);
 const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
 let nx=LESSONS.findIndex((_,i)=>done[i]==null);if(nx<0)nx=0;
 $("t0").innerHTML=
  '<div class="coach"><div><small>Continue learning</small><h3>Lesson '+(nx+1)+'</h3><p>'+title(nx)+'</p><button class="gold" data-l="'+nx+'">Start ▶</button></div><img src="coach.webp" alt="Vaani"></div>'+
  '<div class="stats"><div class="card"><b>'+n+'/'+total+'</b><small>Lessons done</small></div><div class="card"><b>'+(n?avg+"%":"–")+'</b><small>Average score</small></div><div class="card"><b>'+(best?best+"%":"–")+'</b><small>Best test</small></div></div>'+
  '<div class="askcard"><div><h3>Ask Vaani</h3><p>Ask Vaani about spelling, pronunciation and your lessons.</p></div><button data-go="ask">Ask 🎙️</button></div>'+
  '<div class="testcard"><div><h3>Test yourself</h3><p>Check what you have learned.</p></div><button data-go="test">Take a test</button></div>'+
'<div class="card"><h3>Offline Lessons</h3><p>Download your lessons to learn without an internet connection.</p><button class="gold" data-download>⬇ Download Lessons</button><small id="downloadStatus" aria-live="polite"></small></div>'+
'<div class="card"><h3>Your progress</h3>'+chart()+'</div>';
 let h="";LESSONS.forEach((l,i)=>{
  if(i%5===0)h+='<h3 class="unit">Unit '+(i/5+1)+' · '+UNITS[i/5]+'</h3>';
  const c=UCOL[Math.floor(i/5)%UCOL.length];
  h+='<button class="item" data-l="'+i+'"><span class="n" style="background:'+c+'">'+(i+1)+'</span><span class="t">'+title(i)+'<small>'+(done[i]!=null?"Score "+done[i]+"%":"Tap to start")+'</small></span><span class="s">'+(done[i]!=null?"✅":"▶️")+'</span></button>';
 }); $("t1").innerHTML=h;
 const ready=!!buildTest(poolOf(done,LESSONS));
 $("t2").innerHTML='<div class="card"><h3>Vaani\'s Test</h3><p class="mute" style="margin:6px 0 12px">10 questions from the lessons you have finished: 5 listening, 3 spelling and 2 speaking.</p>'+
  (ready?'<button data-go="test" style="width:100%">Start test ▶</button>':'<p class="warn">Finish Lesson 1 first, then your test unlocks.</p><button data-l="0" style="width:100%">Go to Lesson 1</button>')+'</div>'+
  (best?'<div class="card"><h3>Your best score</h3><div class="bigp">'+best+'%</div></div>':'');
}

async function downloadLessons() {
    const status = $("downloadStatus");
    const button = document.querySelector("[data-download]");

    if (status) status.textContent = "Preparing your lessons...";
    if (button) button.disabled = true;

    try {
        if (!("serviceWorker" in navigator) || !("caches" in window)) {
            throw new Error("Offline storage is not supported by this browser.");
        }

        await navigator.serviceWorker.ready;

        const cache = await caches.open("vaani-v4");

                            await cache.addAll([
            "./",
            "./index.html",
            "./lessons.js",
            "./manifest.webmanifest",
            "./logo.webp",
            "./coach.webp",
            "./icon-192.png",
            "./icon-512.png",
            "./icon-maskable-512.png"
        ]);
        if (status) {
            status.textContent = "✓ Lessons downloaded! You can now learn offline.";
        }

    } catch (error) {
        if (status) {
            status.textContent = "Download failed: " + error.message;
        }
    } finally {
        if (button) button.disabled = false;
    }
}

 $("home").addEventListener("click",e=>{
 const d=e.target.closest("[data-download]");
 if(d){downloadLessons();return}

 const l=e.target.closest("[data-l]");
 if(l){openLesson(+l.dataset.l);return}

 const g=e.target.closest("[data-go]");
 if(g){g.dataset.go==="ask"?openAsk():openTest();return}

 const t=e.target.closest("[data-t]");
 if(t)tab(+t.dataset.t);
});

$("bulb").onclick=()=>{const s=steps[idx];if(!s)return;const t=s.say||s.en||s.q;if(s.silent)return;speak([{t:t,l:"en"}],()=>{if(s.t==="rep"&&!locked)startListen(s)})};
/* ---- Ask Vaani ---- */

/* ---- Vaani AI Tutor ---- */

let askHistory = [];
let askBusy = false;

function addMsg(who, html) {
    const c = $("chat");
    const d = document.createElement("div");

    d.className = "msg " + who;
    d.innerHTML = html;

    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
}

function renderAns(a) {
    let h = esc(a.text);

    if (a.tiles) {
        a.tiles.forEach((L, i) => {
            h += '<div class="tiles">' +
                (a.words && a.words.length > 1
                    ? '<span>' + esc(a.words[i]) + '</span>'
                    : '') +
                L.map(x => '<b>' + esc(x) + '</b>').join("") +
                '</div>';
        });
    }

    return h;
}


async function sendAsk(q) {
    q = q.trim();

    if (!q || askBusy) return;

    askBusy = true;
    $("amic").disabled = true;

    addMsg("me", esc(q));
    $("afb").textContent = "";

    addMsg("v", "Vaani is thinking...");

    try {
        // Use Vaani's built-in tutor.
        // No API key or backend server required.
        const a = answer(q, {
    now: new Date(),
    pics: PICS,
    lang: lang
});

        // Remove the temporary thinking message.
        const chat = $("chat");

        if (chat.lastElementChild &&
            chat.lastElementChild.classList.contains("v")) {
            chat.lastElementChild.remove();
        }

        addMsg("v", renderAns(a));

        if (a.say && Array.isArray(a.say)) {
    speak(a.say);
}
    } catch (error) {
        const chat = $("chat");

        if (chat.lastElementChild &&
            chat.lastElementChild.classList.contains("v")) {
            chat.lastElementChild.remove();
        }

        addMsg("v", "Sorry! I couldn't prepare an answer. Please try another question.");

        $("afb").textContent = error.message;

    } finally {
        askBusy = false;
        $("amic").disabled = false;
    }
}

function askListen() {
    if (!SR) {
        fbMsg(
            "Speech recognition is not supported here. Please type your question.",
            false,
            "afb"
        );

        $("atype").classList.remove("hide");
        return;
    }

    if (!navigator.onLine) {
        fbMsg(
            "You are offline. You can type a basic question instead.",
            false,
            "afb"
        );

        $("atype").classList.remove("hide");
        return;
    }

    listenOnce(UIS.ask, {
        final: alts => {
            micFails = 0;
            if (alts.length) sendAsk(alts[0]);
        },

        fail: () => {
            $("atype").classList.remove("hide");
        }
    });
}

function openAsk() {
    token++;
    U = UIS.ask;
    micFails = 0;

    show_("ask");

    if (!$("chat").children.length) {
        addMsg(
            "v",
            "Hello! I am Vaani, your English tutor. " +
            "You can ask me about grammar, vocabulary, " +
            "pronunciation, translation or spoken English. " +
            "Tap the microphone and speak!"
        );
    }

    $("chips").innerHTML = [
        "Explain is, am and are",
        "Correct my English sentence",
        "How do I introduce myself?",
        "What does beautiful mean?",
        "Translate hello into Marathi"
    ].map(t =>
        '<button class="chip">' + esc(t) + '</button>'
    ).join("");

    ensureMic();
}


$("chips").addEventListener("click", e => {
    if (e.target.classList.contains("chip")) {
        sendAsk(e.target.textContent);
    }
});

$("aback").onclick = goHome;

$("amic").onclick = () => {
    if (rec) {
        try { rec.stop(); } catch (e) {}
    } else {
        askListen();
    }
};

$("arstop").onclick = () => {
    try { rec && rec.stop(); } catch (e) {}
};

$("akb").onclick = () => {
    $("atype").classList.toggle("hide");
    $("ain").focus();
};

$("asend").onclick = () => {
    const value = $("ain").value;
    $("ain").value = "";
    sendAsk(value);
};

$("ain").onkeydown = e => {
    if (e.key === "Enter") {
        const value = $("ain").value;
        $("ain").value = "";
        sendAsk(value);
    }
};

$("abulb").onclick = () => {
    sendAsk("What can you teach me?");
};

function toHome(){const sp=$("splash");if(!sp)return;sp.classList.add("out");setTimeout(()=>{sp.remove();goHome()},450)}
setTimeout(toHome,2600);$("splash").onclick=toHome;
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
